name: CI Build

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

env:
  GO_VERSION: '1.24.0'

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            output: kiro2api-linux-amd64
          - os: linux
            arch: arm64
            output: kiro2api-linux-arm64
          - os: windows
            arch: amd64
            output: kiro2api-windows-amd64.exe
          - os: darwin
            arch: amd64
            output: kiro2api-darwin-amd64
          - os: darwin
            arch: arm64
            output: kiro2api-darwin-arm64

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build binary for ${{ matrix.os }}-${{ matrix.arch }}
        run: |
          GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} CGO_ENABLED=0 \
          go build -o ${{ matrix.output }} -ldflags="-s -w" main.go
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: ${{ matrix.output }}
          retention-days: 30
          if-no-files-found: error
