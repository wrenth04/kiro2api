name: Multi-Platform Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (must start with v)'
        required: true
        default: 'v1.0.0'

env:
  GO_VERSION: '1.24.0'

jobs:
  build:
    name: Build All Platforms
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Get version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION=${{ github.event.inputs.tag }}
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
        shell: bash

      - name: Build binaries for all platforms
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          LDFLAGS="-s -w -X main.Version=${VERSION}"

          # Linux builds
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o kiro2api-linux-amd64 -ldflags="${LDFLAGS}" main.go
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o kiro2api-linux-arm64 -ldflags="${LDFLAGS}" main.go

          # Windows builds
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o kiro2api-windows-amd64.exe -ldflags="${LDFLAGS}" main.go
          GOOS=windows GOARCH=arm64 CGO_ENABLED=0 go build -o kiro2api-windows-arm64.exe -ldflags="${LDFLAGS}" main.go

          # macOS builds
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -o kiro2api-darwin-amd64 -ldflags="${LDFLAGS}" main.go
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -o kiro2api-darwin-arm64 -ldflags="${LDFLAGS}" main.go
        shell: bash

      - name: Create checksums
        run: |
          for file in kiro2api-*; do
            sha256sum "$file" > "$file.sha256"
          done
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: kiro2api-*
          retention-days: 5

  create-release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          name: binaries
          path: release-artifacts

      - name: Create Release Notes
        id: notes
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          {
            echo "## Release ${VERSION}"
            echo ""
            echo "### 📦 Downloads"
            echo ""
            ls release-artifacts/ | grep -v '.sha256' | while read file; do
              echo "- [\`${file}\`](./releases/download/${VERSION}/${file})"
            done
            echo ""
            echo "### 🔐 Checksums"
            echo ""
            echo "\`\`\`"
            cat release-artifacts/*.sha256
            echo "\`\`\`"
            echo ""
            echo "### 📋 Usage"
            echo ""
            echo "\`\`\`bash"
            echo "# Download binary"
            echo "wget https://github.com/${{ github.repository }}/releases/download/${VERSION}/kiro2api-linux-amd64"
            echo ""
            echo "# Make executable"
            echo "chmod +x kiro2api-linux-amd64"
            echo ""
            echo "# Run"
            echo "./kiro2api-linux-amd64"
            echo "\`\`\`"
          } > release-notes.md
          cat release-notes.md >> $GITHUB_STEP_SUMMARY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: release-artifacts/*
          body_path: release-notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-artifacts:
    name: Verify Artifacts
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          name: binaries
          path: verify-artifacts

      - name: Verify binary existence
        run: |
          echo "✅ Artifacts downloaded successfully"
          echo ""
          echo "📋 All binaries:"
          find verify-artifacts -type f ! -name "*.sha256" | sort
          echo ""
          echo "📋 All checksums:"
          find verify-artifacts -type f -name "*.sha256" | sort

      - name: Verify checksums
        run: |
          cd verify-artifacts
          sha256sum -c *.sha256 || exit 1
